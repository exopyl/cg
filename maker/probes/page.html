<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Sonde de la page du graphe</title>
  <style>
    body { display: flex; height: 100vh; margin: 0; }
    #stage { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #view { flex: 1; width: 100%; display: block; }
  </style>
</head>
<body>
  <!-- Le MEME balisage que maker/web/graph.html, aux memes identifiants : ce
       qu'on eprouve ici est graph-host.js lui-meme -- la cadence par rAF, le
       routage d'entrees, la boucle de ticks --, que la sonde de l'editeur ne
       touche pas (elle parle au worker en direct). Une page qui ne rejouerait
       pas ce balisage n'eprouverait rien du controleur. -->
  <aside id="panel">
    <strong id="beat">0</strong>
    <strong id="frames">0</strong>
    <div id="summary">—</div>
    <input type="file" id="file">
    <button id="overlay">overlay</button>
    <button id="stats">stats</button>
    <button id="export">export</button>
    <button id="reset">reset</button>
  </aside>
  <main id="stage">
    <canvas id="view" tabindex="0"></canvas>
    <div id="log"></div>
  </main>
  <script type="module" src="./page.js"></script>
</body>
</html>

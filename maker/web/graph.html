<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graphe nodal — maker</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    /* La page du graphe ne partage pas le shell des six pages de formes : son
       module vit dans un worker et son canvas lui est TRANSFERE, donc rien du
       montage de shell.js ne s'y applique. */
    body { display: flex; height: 100vh; margin: 0; }
    #panel { width: 20rem; overflow: auto; padding: .75rem; box-sizing: border-box; }
    #stage { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
    #view { flex: 1; width: 100%; display: block; background: #16181d; outline: none; }

    /* SEPARATEUR. Un element du DOM par-dessus le canvas, et non un widget
       dessine dedans : le glissement est un geste du navigateur, qui le gere
       mieux qu'ImGui a travers un pont de messages, et il reste saisissable
       meme quand le worker est occupe a calculer. Il ne fait que RAPPORTER une
       fraction ; le worker en tire le viewport de la scene et le C++ la
       disposition de ses panneaux. */
    #split { position: absolute; top: 0; bottom: 8rem; width: 9px; margin-left: -4px;
             cursor: col-resize; z-index: 5; touch-action: none; }
    #split::before { content: ""; position: absolute; top: 0; bottom: 0; left: 4px;
                     width: 1px; background: #3a3f4a; }
    #split:hover::before, #split.drag::before { background: #5aa2ff; width: 2px; }
    #log { height: 8rem; overflow: auto; font: 11px/1.45 ui-monospace, monospace;
           white-space: pre-wrap; padding: .5rem; }
    .row { display: flex; gap: .25rem; flex-wrap: wrap; margin: .35rem 0; }
    h2 { font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; margin: .9rem 0 .3rem; }
    #summary { font-weight: 700; }
    kbd { font: 11px ui-monospace, monospace; border: 1px solid #555; border-radius: 3px;
          padding: 0 .25rem; }
  </style>
  <style>
    /* La barre remplace la colonne : une ligne, pas un tiers de l'ecran. */
    body { display: flex; flex-direction: column; height: 100vh; margin: 0; }
    #bar { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
           padding: .35rem .6rem; border-bottom: 1px solid #2a2d33; font-size: .82rem; }
    #bar .brand { font-weight: 600; opacity: .85; }
    #bar .stat { opacity: .7; }
    #bar .pick { display: inline-flex; align-items: center; gap: .3rem; opacity: .85; }
    #bar .pick input[type=file] { width: 8.5rem; font-size: .75rem; }
    #stage { flex: 1 1 auto; position: relative; min-height: 0; }
  </style>
</head>
<body>
  <!--
    PAS DE PANNEAU LATERAL, et UN SEUL CANVAS pour deux volets : l'editeur nodal
    a gauche, la vue 3D a droite, separes par une poignee que l'on glisse. Un
    seul canvas parce qu'un seul contexte WebGL2 -- le C++ et le JS y dessinent
    tous deux, et le navigateur refuserait deux contextes sur un meme canvas ;
    la separation se fait donc au viewport, pas au DOM.

    Ce qui restait utile -- les entrees de fichier, les bascules, l'export -- tient
    dans la barre ci-dessous. Le reste (mode d'emploi, compteurs de frames) a ete
    retire : c'etait de la documentation, pas des commandes.
  -->
  <header id="bar">
    <span class="brand"><a href="./index.html">← maker</a> · Graphe</span>
    <span id="summary" class="stat">—</span>

    <label class="pick">ouvrir un document <input type="file" id="open" accept=".json,application/json"></label>

    <button id="overlay">masquer l'éditeur</button>
    <button id="export">exporter</button>
    <button id="stats">mémoire</button>
    <button id="reset">vider</button>

    <!-- Conserves parce que le JS les ecrit, mais hors du chemin de l'oeil :
         ils mesuraient la vivacite du thread pendant un calcul long. -->
    <span class="stat" hidden><b id="beat">0</b>/<b id="frames">0</b></span>
  </header>

  <main id="stage">
    <canvas id="view" tabindex="0"></canvas>
    <div id="split" title="glisser pour partager l'espace"></div>
    <div id="log"></div>
  </main>

  <script type="module" src="./js/graph-host.js"></script>
</body>
</html>

<?xml version="1.0" encoding="UTF-8"?>
<!-- Un cercle en quatre arcs cubiques, sur un canevas de 100.
     Doublon a l'echelle 20 dans circle_large.svg : les deux fichiers decrivent
     EXACTEMENT le meme dessin, et ne different que par l'echelle du document.
     Sert a verrouiller l'invariant d'unites de SvgExtrudeOptions::flattenTol. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <path fill="#000" d="M 90,50
    C 90,72.092 72.092,90 50,90
    C 27.908,90 10,72.092 10,50
    C 10,27.908 27.908,10 50,10
    C 72.092,10 90,27.908 90,50 Z"/>
</svg>

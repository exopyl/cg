<?xml version="1.0" encoding="UTF-8"?>
<!-- Trace FERME sans remplissage : son trait est un ANNEAU de 4 x 100 x 4 = 1600
     unites carrees. Joint mitre explicite, l'aire attendue en depend. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="120" height="120" viewBox="0 0 120 120">
  <rect x="10" y="10" width="100" height="100"
        fill="none" stroke="#ff0000" stroke-width="4" stroke-linejoin="miter"/>
</svg>

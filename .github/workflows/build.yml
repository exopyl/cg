name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  # Tag of the cg_binaries Release this build consumes.
  # v1.1.0 adds lib3mf 2.5.0 (3MF import) alongside openNURBS and OCCT.
  CG_BINARIES_VERSION: v1.1.0

jobs:
  build:
    name: ci-linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download cg_binaries archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .deps/cg_binaries
          cd .deps
          gh release download "$CG_BINARIES_VERSION" \
            --repo "${{ github.repository_owner }}/cg_binaries" \
            --pattern 'cgbinaries-*-linux-x86_64.zip'
          unzip -q cgbinaries-*-linux-x86_64.zip
          mv cgbinaries-*-linux-x86_64/* cg_binaries/
          rm -rf cgbinaries-*-linux-x86_64 cgbinaries-*-linux-x86_64.zip

      - name: Install Ninja + OCCT
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            zlib1g-dev \
            libocct-foundation-dev \
            libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev \
            libocct-data-exchange-dev \
            libtbb-dev
          # OpenSCAD : EXECUTABLE lance par les tests de l'import .scad
          # (test/tu_cgmesh_import_scad.cpp), sans quoi ils sont sautes. Ligne a
          # part pour borner --no-install-recommends a ce seul paquet : la
          # recommandation (openscad-mcad, bibliotheque de modules) ne sert a
          # aucun test, et la retirer fait passer l'installation de 245 a 138
          # paquets sur ubuntu:24.04 (593 -> 331 Mo, mesure sur une image nue).
          sudo apt-get install -y --no-install-recommends openscad
          openscad --version

      - name: Configure
        run: cmake --preset ci-linux

      - name: Build
        run: cmake --build --preset ci-linux

      - name: Test
        # -j en ligne de commande et non dans le preset : testPresets.execution.jobs
        # n'accepte qu'un entier litteral, or le nombre de coeurs d'un runner
        # GitHub-hosted a deja change (2 -> 4 sur les depots publics) et peut encore
        # changer. `nproc` donne la valeur du runner du jour ; l'echo la trace dans
        # le log, seule facon de savoir de quoi on disposait reellement.
        #
        # CG_REQUIRE_OPENSCAD : OpenSCAD est installe ci-dessus, donc un OpenSCAD
        # introuvable est une regression de l'environnement -- les tests .scad
        # ECHOUENT au lieu de sauter en silence (test/scad_test_support.h).
        env:
          CG_REQUIRE_OPENSCAD: "1"
        run: |
          echo "nproc = $(nproc)"
          ctest --preset ci-linux -j "$(nproc)"

      - name: Discord Notification
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          status_emoji="🚀"
          if [ "${{ job.status }}" != "success" ]; then status_emoji="💥"; fi
          curl -H "Content-Type: application/json" \
          -d "{\"content\": \"$status_emoji **Build Status: ${{ job.status }}**\nRepo: ${{ github.repository }} | Branch: ${{ github.ref_name }}\nTriggered by: ${{ github.actor }}\nView Run: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>\"}" \
          $DISCORD_WEBHOOK



  sanitizers:
    name: ci-linux-asan
    runs-on: ubuntu-latest

    # Ce que ce job prouve, et que RIEN d'autre ne prouve : les lecteurs de
    # fichiers binaires n'ecrivent pas hors bornes. Le job ci-linux fait tourner
    # les memes tests, mais un depassement de quelques octets dans un tas Debug
    # ne s'y voit PAS -- le test passe au vert avec la memoire deja corrompue.
    #
    # Les fixtures tronques et corrompus (test/tu_cgmesh_io_malformed.cpp) sont la
    # moitie visible du filet ; ASan en est la moitie qui detecte. Chacun sans
    # l'autre ne vaut presque rien : des fixtures sans sanitizer ne verifient que
    # l'absence de plantage franc, un sanitizer sans entree malformee n'a rien a
    # se mettre sous la dent.
    #
    # continue-on-error deliberement ABSENT : un rapport ASan doit faire echouer
    # le job. Un filet dont l'echec est tolere n'est pas un filet.
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download cg_binaries archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .deps/cg_binaries
          cd .deps
          gh release download "$CG_BINARIES_VERSION" \
            --repo "${{ github.repository_owner }}/cg_binaries" \
            --pattern 'cgbinaries-*-linux-x86_64.zip'
          unzip -q cgbinaries-*-linux-x86_64.zip
          mv cgbinaries-*-linux-x86_64/* cg_binaries/
          rm -rf cgbinaries-*-linux-x86_64 cgbinaries-*-linux-x86_64.zip

      - name: Install Ninja + OCCT
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            zlib1g-dev \
            libocct-foundation-dev \
            libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev \
            libocct-data-exchange-dev \
            libtbb-dev
          # OpenSCAD : EXECUTABLE lance par les tests de l'import .scad
          # (test/tu_cgmesh_import_scad.cpp), sans quoi ils sont sautes. Ligne a
          # part pour borner --no-install-recommends a ce seul paquet : la
          # recommandation (openscad-mcad, bibliotheque de modules) ne sert a
          # aucun test, et la retirer fait passer l'installation de 245 a 138
          # paquets sur ubuntu:24.04 (593 -> 331 Mo, mesure sur une image nue).
          sudo apt-get install -y --no-install-recommends openscad
          openscad --version

      - name: Configure
        run: cmake --preset ci-linux-asan

      - name: Build
        run: cmake --build --preset ci-linux-asan

      - name: Test under ASan + UBSan
        # detect_leaks=0 : les fuites sont un AUTRE sujet, et le depot en a
        # beaucoup (les lecteurs 3DS rendent nullptr sans fermer leur FILE*).
        # Les activer ici noierait le signal cherche -- les ecritures hors
        # bornes -- sous des centaines de rapports sans rapport avec elles. Une
        # chasse aux fuites merite son propre chantier et son propre job.
        #
        # abort_on_error=1 + print_stacktrace=1 : on veut la pile au premier
        # incident, et un code de sortie non nul.
        #
        # CG_REQUIRE_OPENSCAD : meme regle que le job ci-linux -- sous ASan, le
        # lanceur de processus et le lecteur OFF des .scad sont exerces pour de
        # bon, pas sautes.
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0:print_stacktrace=1
          UBSAN_OPTIONS: print_stacktrace=1
          CG_REQUIRE_OPENSCAD: "1"
        run: |
          echo "nproc = $(nproc)"
          ctest --preset ci-linux-asan -j "$(nproc)"

  boilerplate:
    name: ci-linux-boilerplate
    runs-on: ubuntu-latest

    # Ce que ce job prouve, et que RIEN d'autre ne prouve : le canvas ImGui a
    # DEUX hotes qui lient. Sans lui, seul l'hote WebAssembly est bati, et D4
    # -- « un seul canvas pour les deux hotes » -- reste une intention. Un filet
    # qui ne tourne pas en CI ne protege rien.
    #
    # Il ne lance aucun test : TU est deja couvert par le job ci-linux, et la
    # propriete cherchee ici est l'edition de liens, pas le comportement.
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download cg_binaries archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .deps/cg_binaries
          cd .deps
          gh release download "$CG_BINARIES_VERSION"             --repo "${{ github.repository_owner }}/cg_binaries"             --pattern 'cgbinaries-*-linux-x86_64.zip'
          unzip -q cgbinaries-*-linux-x86_64.zip
          mv cgbinaries-*-linux-x86_64/* cg_binaries/
          rm -rf cgbinaries-*-linux-x86_64 cgbinaries-*-linux-x86_64.zip

      - name: Install Ninja + OCCT
        run: |
          sudo apt-get update
          sudo apt-get install -y             ninja-build             zlib1g-dev             libocct-foundation-dev             libocct-modeling-data-dev             libocct-modeling-algorithms-dev             libocct-data-exchange-dev             libtbb-dev

      - name: Install GLFW build dependencies
        # GLFW est versionne sous extern/, mais il se COMPILE contre les en-tetes
        # X11 et OpenGL de la machine : sans elles, la configuration de son
        # sous-arbre echoue avant toute compilation de ce depot.
        run: |
          sudo apt-get install -y             libgl1-mesa-dev             libx11-dev             libxrandr-dev             libxinerama-dev             libxcursor-dev             libxi-dev

      - name: Configure
        run: cmake --preset ci-linux-boilerplate

      - name: Build the canvas and its native host
        run: cmake --build --preset ci-linux-boilerplate

      - name: Assert the executable exists
        # `cmake --build` peut rendre 0 sans avoir produit la cible attendue si
        # celle-ci n'a pas ete ajoutee -- une option mal orthographiee suffit.
        # C'est le fichier qui fait foi, pas le code de sortie.
        run: |
          set -euo pipefail
          exe=build/ci-linux-boilerplate/cggraph-boilerplate/cggraph-boilerplate
          test -x "$exe"
          ls -l "$exe"

  clang:
    name: ci-linux-clang
    runs-on: ubuntu-latest

    # Ce que ce job prouve : le depot compile, lie et passe sa suite sous Clang,
    # en Release, avec les memes options et les memes tierces que ci-linux.
    # Le job SQ compile aussi avec Clang, mais en Debug instrumente pour la
    # couverture et sur une configuration a part (coverage.sh) : il ne dit rien
    # d'un build Clang optimise.
    #
    # Pas de -Werror (D7 du plan 1) : les warnings Clang se lisent dans le
    # journal du build, prefixes par le chemin de l'unite qui les emet.
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download cg_binaries archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .deps/cg_binaries
          cd .deps
          gh release download "$CG_BINARIES_VERSION" \
            --repo "${{ github.repository_owner }}/cg_binaries" \
            --pattern 'cgbinaries-*-linux-x86_64.zip'
          unzip -q cgbinaries-*-linux-x86_64.zip
          mv cgbinaries-*-linux-x86_64/* cg_binaries/
          rm -rf cgbinaries-*-linux-x86_64 cgbinaries-*-linux-x86_64.zip

      - name: Install Clang + Ninja + OCCT
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            ninja-build \
            zlib1g-dev \
            libocct-foundation-dev \
            libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev \
            libocct-data-exchange-dev \
            libtbb-dev
          # OpenSCAD : meme regle que ci-linux (lanceur des tests .scad,
          # --no-install-recommends borne a ce seul paquet).
          sudo apt-get install -y --no-install-recommends openscad
          openscad --version
          clang++ --version

      - name: Configure
        run: cmake --preset ci-linux-clang

      - name: Build
        run: cmake --build --preset ci-linux-clang

      - name: Test
        # -j et CG_REQUIRE_OPENSCAD : memes raisons que l'etape Test de ci-linux.
        env:
          CG_REQUIRE_OPENSCAD: "1"
        run: |
          echo "nproc = $(nproc)"
          ctest --preset ci-linux-clang -j "$(nproc)"

  clang-fma:
    name: ci-linux-clang-fma
    runs-on: ubuntu-latest

    # Ce que ce job prouve, et que RIEN d'autre ne prouve : les suites cgarchi
    # passent quand le compilateur fusionne a*b+c en une instruction FMA. MSVC
    # ne contracte jamais ; ci-linux-clang vise le x86-64 de base, sans
    # instruction FMA ; ci-linux-asan compile en -O0 ; ci-linux (GCC) ne
    # contracte que si sa cible porte FMA, ce que rien ne fixe. Deux classes de
    # code n'echouent que sous contraction : une egalite au bit pres contre une
    # expression a*b+c recalculee dans le test, et un predicat d'orientation
    # (a*b - c*d) teste par egalite ou par signe, qui doit passer par une
    # evaluation stricte (StrictCrossDifference, classical_greek_entablature.cpp).
    #
    # Preset ci-linux-clang-fma : -O2 -march=x86-64-v3 -ffp-contract=fast sur
    # tout le depot, TU et TU_faults seuls construits, suites TEST_cgarchi_*
    # seules executees. OpenSCAD n'est pas installe : aucune suite cgarchi ne
    # le lance.
    #
    # Deux gardes garantissent que les suites tournent sur du code contracte :
    # le processeur porte x86-64-v3, et l'objet de l'entablement grec contient
    # au moins une instruction FMA. Elles ne garantissent pas qu'une mutation
    # donnee rougisse : quelles expressions sont fusionnees, et dans quel
    # ordre, depend de la version de Clang.
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Assert the runner supports x86-64-v3
        # Echec avant toute compilation si le processeur ne porte pas
        # x86-64-v3. fma et avx2 se lisent dans /proc/cpuinfo ; le niveau
        # complet (bmi1, bmi2, f16c, lzcnt, movbe...) est juge par le chargeur
        # de la glibc (>= 2.33), dont --help liste les niveaux x86-64-vN et
        # marque « (supported » ceux du processeur. Un chargeur qui ne liste
        # aucun niveau ne juge rien : le fait est ecrit dans le log, sans echec,
        # et seuls fma et avx2 font foi.
        #
        # La sortie du chargeur est capturee avant d'etre filtree : sous
        # pipefail, un grep qui s'arrete au premier resultat couperait le
        # chargeur par SIGPIPE et ferait echouer l'etape a tort.
        run: |
          set -euo pipefail
          grep -m1 'model name' /proc/cpuinfo || true
          for flag in fma avx2; do
            if ! grep -q -w "$flag" /proc/cpuinfo; then
              echo "::error::processeur sans $flag : les binaires x86-64-v3 de ce job ne peuvent pas s'y executer"
              exit 1
            fi
          done
          echo "fma et avx2 presents"
          levels=$(/lib64/ld-linux-x86-64.so.2 --help 2>&1 | grep -E 'x86-64-v[0-9]' || true)
          if [ -z "$levels" ]; then
            echo "le chargeur ne liste aucun niveau x86-64-vN : niveau complet non verifie"
          else
            echo "$levels"
            if ! grep -q -E 'x86-64-v3 \(supported' <<< "$levels"; then
              echo "::error::le chargeur juge x86-64-v3 non supporte par ce processeur"
              exit 1
            fi
          fi

      - name: Download cg_binaries archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .deps/cg_binaries
          cd .deps
          gh release download "$CG_BINARIES_VERSION" \
            --repo "${{ github.repository_owner }}/cg_binaries" \
            --pattern 'cgbinaries-*-linux-x86_64.zip'
          unzip -q cgbinaries-*-linux-x86_64.zip
          mv cgbinaries-*-linux-x86_64/* cg_binaries/
          rm -rf cgbinaries-*-linux-x86_64 cgbinaries-*-linux-x86_64.zip

      - name: Install Clang + Ninja + OCCT
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            ninja-build \
            zlib1g-dev \
            libocct-foundation-dev \
            libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev \
            libocct-data-exchange-dev \
            libtbb-dev
          clang++ --version

      - name: Configure
        run: cmake --preset ci-linux-clang-fma

      - name: Build
        run: cmake --build --preset ci-linux-clang-fma

      - name: Assert FMA instructions in cgarchi
        # Compte des vfmadd, vfmsub, vfnmadd, vfnmsub (et variantes
        # vfmaddsub, vfmsubadd) par objet de cgarchi, trace dans le log. Le
        # seuil porte sur l'objet de l'entablement grec : ses predicats sont en
        # evaluation stricte, mais ses autres calculs se contractent, donc zero
        # FMA y signifie que les drapeaux du preset n'ont pas ete appliques.
        run: |
          set -euo pipefail
          dir=build/ci-linux-clang-fma/src/cgarchi
          total=0
          while IFS= read -r obj; do
            n=$(objdump -d --no-show-raw-insn "$obj" | grep -c -E '\svf(n)?m(add|sub)' || true)
            printf '%6d  %s\n' "$n" "${obj#$dir/}"
            total=$((total + n))
          done < <(find "$dir" -name '*.o' | sort)
          echo "total : $total"
          obj=$(find "$dir" -name 'classical_greek_entablature.cpp.o')
          if [ -z "$obj" ]; then
            echo "::error::objet classical_greek_entablature.cpp.o introuvable sous $dir"
            exit 1
          fi
          n=$(objdump -d --no-show-raw-insn "$obj" | grep -c -E '\svf(n)?m(add|sub)' || true)
          if [ "$n" -eq 0 ]; then
            echo "::error::aucune instruction FMA dans $obj : la contraction n'a pas eu lieu, les suites n'eprouvent rien"
            exit 1
          fi

      - name: Test
        # -j : memes raisons que l'etape Test de ci-linux.
        run: |
          echo "nproc = $(nproc)"
          ctest --preset ci-linux-clang-fma -j "$(nproc)"

  windows:
    name: ci-windows (${{ matrix.config }})
    # Image figee et non windows-latest : le preset ci-windows exige VS 2026
    # (generateur Visual Studio 18 2026, binaires de cg_binaries lies par
    # l'editeur de liens 14.50), et windows-latest change d'image sans preavis.
    runs-on: windows-2025-vs2026

    # Ce que ce job prouve : le depot compile, lie et passe sa suite sous MSVC,
    # en Debug et en Release, contre les binaires Windows de cg_binaries -- la
    # meme release que les jobs Linux (CG_BINARIES_VERSION).
    #
    # Le preset ci-windows herite du generateur Visual Studio 18 2026 : il exige
    # un runner qui porte VS 2026. Les DLL d'OCCT, d'OpenNURBS et de lib3mf sont
    # copiees a cote de TU.exe par test/CMakeLists.txt : aucun PATH a poser.
    #
    # OpenSCAD n'est pas installe sur ce runner et CG_REQUIRE_OPENSCAD n'est pas
    # pose : les tests de l'import .scad y sont SAUTES (GTEST_SKIP), comme sur un
    # poste sans OpenSCAD. Le lanceur de processus Windows n'est donc pas exerce
    # par ce job.
    #
    # fail-fast desactive : un echec Debug ne doit pas annuler la Release, les
    # deux colonnes se lisent separement.
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Debug
            preset: ci-windows-debug
          - config: Release
            preset: ci-windows-release

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download cg_binaries archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .deps/cg_binaries
          cd .deps
          gh release download "$CG_BINARIES_VERSION" \
            --repo "${{ github.repository_owner }}/cg_binaries" \
            --pattern 'cgbinaries-*-windows-x86_64.zip'
          7z x -y -bso0 -bsp0 cgbinaries-*-windows-x86_64.zip
          mv cgbinaries-*-windows-x86_64/* cg_binaries/
          rm -rf cgbinaries-*-windows-x86_64 cgbinaries-*-windows-x86_64.zip
          ls cg_binaries

      - name: Toolchain versions
        # Versions de CMake et de Visual Studio de l'image : un echec du
        # generateur Visual Studio 18 2026 a l'etape suivante se lit ici.
        run: |
          cmake --version
          "/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" \
            -latest -property catalog_productDisplayVersion

      - name: Configure
        run: cmake --preset ci-windows

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        # -j : nombre de processeurs du runner du jour, trace dans le log (cf.
        # l'etape Test de ci-linux). Debug et Release partagent test-run dans un
        # meme arbre ; ici chaque configuration a son propre runner.
        run: |
          echo "NUMBER_OF_PROCESSORS = $NUMBER_OF_PROCESSORS"
          ctest --preset ${{ matrix.preset }} -j "$NUMBER_OF_PROCESSORS"

  maker-wasm:
    name: maker-wasm
    runs-on: ubuntu-latest

    # Ce que ce job prouve : maker se compile ET se lie sous Emscripten, et le
    # module produit se charge, expose son catalogue de formes et rend pour
    # chacune un maillage non vide, sans ecrire sur stderr
    # (maker/tools/check_module.mjs).
    #
    # Runner Linux et preset ci-maker-wasm (Ninja) : le preset maker-wasm est en
    # NMake, qui n'existe qu'avec Visual Studio. ci-maker-wasm en herite et ne
    # change que le generateur ; la configuration WebAssembly reste unique.
    #
    # Le build ecrit maker.js et maker.wasm dans maker/web/, fichiers suivis par
    # git. Ce job ne commite rien : ces fichiers n'existent que dans l'espace de
    # travail du runner.
    env:
      # Version d'Emscripten figee, celle de l'emsdk de reference (D11). Sert de
      # tag au depot emsdk et de version a installer.
      EMSDK_VERSION: 6.0.8
      # Cardinalites attendues du catalogue (listShapes) : toute forme ajoutee
      # ou retiree doit les mettre a jour ici.
      MAKER_EXPECTED_SHAPES: "29"
      MAKER_EXPECTED_GOTHIC: "2"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install emsdk
        run: |
          set -euo pipefail
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch "$EMSDK_VERSION" \
            https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          cd "$RUNNER_TEMP/emsdk"
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"

      - name: Remove committed module artefacts
        # Les artefacts suivis par git sont retires AVANT le build : un build
        # qui ne relierait pas maker laisserait sinon le harnais verifier la
        # version commitee, et passer au vert sur un module qui n'est pas celui
        # de ce commit.
        run: rm -f maker/web/maker.js maker/web/maker.wasm

      - name: Configure and build
        # emsdk_env.sh n'agit que sur le shell qui le source : configuration et
        # build partagent donc cette etape.
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcc --version
          ninja --version
          cmake --preset ci-maker-wasm
          cmake --build --preset ci-maker-wasm

      - name: Assert the module exists
        # C'est le fichier qui fait foi, pas le code de sortie du build.
        run: |
          set -euo pipefail
          test -s maker/web/maker.js
          test -s maker/web/maker.wasm
          ls -l maker/web/maker.js maker/web/maker.wasm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check the module
        run: |
          node --version
          node maker/tools/check_module.mjs maker/web \
            "$MAKER_EXPECTED_SHAPES" "$MAKER_EXPECTED_GOTHIC"
